name: uos-repro
on:
  workflow_dispatch:
jobs:
  repro:
    runs-on: ubuntu-latest
    container: python:3.9-slim-buster
    steps:
      - uses: actions/checkout@v4
      - name: install tk + xvfb
        run: |
          set -e
          printf 'deb http://archive.debian.org/debian buster main\n' > /etc/apt/sources.list
          apt-get update -o Acquire::Retries=3
          apt-get install -y --no-install-recommends tk8.6 libtk8.6 tcl8.6 libtcl8.6 xvfb xauth xdg-utils ca-certificates git binutils
          python -c "import tkinter; print('tkinter OK on', __import__('sys').version)"
      - name: deps
        run: python -m pip install qrcode pillow psutil pyinstaller
      - name: build-fixed
        run: |
          cat > pv-linux.spec <<'SPEC'
          # -*- mode: python ; coding: utf-8 -*-
          a = Analysis(
              ['app.py'],
              pathex=[], binaries=[],
              datas=[('index.html','.'),('qr.html','.'),('manifest.json','.'),('icon-192.png','.'),('icon-512.png','.'),('apple-touch-icon.png','.')],
              hiddenimports=['PIL._tkinter_finder'], hookspath=[], hooksconfig={}, runtime_hooks=[],
              excludes=['tkinterdnd2','tkinterdnd2.TkinterDnD'], noarchive=False, optimize=0,
          )
          _XP = ('libX11','libxcb','libXft','libXext','libXrender','libXss','libXau','libXdmcp')
          a.binaries = [b for b in a.binaries if not b[0].startswith(_XP)]
          pyz = PYZ(a.pure)
          exe = EXE(pyz, a.scripts, [], exclude_binaries=True, name='PhoneVoice',
                    debug=False, bootloader_ignore_signals=False, strip=False, upx=False,
                    console=False, disable_windowed_traceback=False, argv_emulation=False,
                    target_arch=None, codesign_identity=None, entitlements_file=None)
          coll = COLLECT(exe, a.binaries, a.datas, strip=False, upx=False, name='PhoneVoice')
          SPEC
          pyinstaller --noconfirm --clean pv-linux.spec
      - name: check-imports
        run: |
          echo "=== 打包内是否还残留 X11 库（应无）==="
          ls dist/PhoneVoice/_internal/ | grep -iE '^lib(X11|xcb|Xft|Xext|Xrender|Xss|Xau|Xdmcp)' || echo "✅ 已剔除"
      - name: run-under-xvfb
        run: xvfb-run -a bash -c 'timeout 15 ./dist/PhoneVoice/PhoneVoice; echo "EXIT=$?"' 2>&1 | tail -60
