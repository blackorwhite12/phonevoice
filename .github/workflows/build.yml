name: Build Releases

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: pip install -r requirements-win.txt pyinstaller
        env:
          PYTHONIOENCODING: utf-8
      - name: 生成图标
        run: python make_icons.py
        env:
          PYTHONIOENCODING: utf-8
      - name: 打包 exe
        run: |
          pyinstaller --noconfirm --windowed --onefile --name "PhoneVoice" `
            --icon app.ico `
            --add-data "index.html;." `
            --add-data "qr.html;." `
            --add-data "manifest.json;." `
            --add-data "icon-192.png;." `
            --add-data "icon-512.png;." `
            --add-data "apple-touch-icon.png;." `
            app.py
      - name: 重命名为平台名
        run: powershell Move-Item -Path "dist\PhoneVoice.exe" -Destination "dist\PhoneVoice-windows-x64.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/PhoneVoice-windows-x64.exe

  build-macos-arm64:
    name: macOS Apple 芯片
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: pip install -r requirements.txt pyinstaller
      - name: 生成图标
        run: python make_icons.py
      - name: 打包 app
        run: |
          pyinstaller --noconfirm --windowed --name "语音输入电脑" \
            --osx-bundle-identifier com.phonevoice.app \
            --icon AppIcon.icns \
            --add-data "index.html:." \
            --add-data "qr.html:." \
            --add-data "manifest.json:." \
            --add-data "icon-192.png:." \
            --add-data "icon-512.png:." \
            --add-data "apple-touch-icon.png:." \
            app.py
      - name: 固定签名身份
        run: |
          codesign --force --deep --sign - \
            --identifier com.phonevoice.app \
            --requirements '=designated => identifier "com.phonevoice.app"' \
            "dist/语音输入电脑.app"
      - name: 压缩为 zip
        run: ditto -c -k --sequesterRsrc --keepParent "dist/语音输入电脑.app" "PhoneVoice-macos-arm64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: PhoneVoice-macos-arm64.zip

  build-macos-x64:
    name: macOS Intel
    runs-on: macos-15-intel
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: pip install -r requirements.txt pyinstaller
      - name: 生成图标
        run: python make_icons.py
      - name: 打包 app
        run: |
          pyinstaller --noconfirm --windowed --name "语音输入电脑" \
            --osx-bundle-identifier com.phonevoice.app \
            --icon AppIcon.icns \
            --add-data "index.html:." \
            --add-data "qr.html:." \
            --add-data "manifest.json:." \
            --add-data "icon-192.png:." \
            --add-data "icon-512.png:." \
            --add-data "apple-touch-icon.png:." \
            app.py
      - name: 固定签名身份
        run: |
          codesign --force --deep --sign - \
            --identifier com.phonevoice.app \
            --requirements '=designated => identifier "com.phonevoice.app"' \
            "dist/语音输入电脑.app"
      - name: 压缩为 zip
        run: ditto -c -k --sequesterRsrc --keepParent "dist/语音输入电脑.app" "PhoneVoice-macos-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-x64
          path: PhoneVoice-macos-x64.zip

  build-linux-uos:
    name: UOS/Linux x64（免安装）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 在 Debian 10 容器里打包（兼容 UOS V20 / glibc 2.28）
        run: docker run --rm -v "$GITHUB_WORKSPACE:/src" -w /src python:3.9-buster bash -lc "bash /src/build_linux.sh"
      - name: 修正容器写入的目录归属
        run: sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE/dist" "$GITHUB_WORKSPACE/build"
      - name: 整理便携目录
        run: |
          mkdir -p dist/UOS-Portable-PhoneVoice
          cp -r dist/PhoneVoice-linux/. dist/UOS-Portable-PhoneVoice/
          cp uos_launcher.sh dist/UOS-Portable-PhoneVoice/启动.sh
          cp uos_readme.txt dist/UOS-Portable-PhoneVoice/使用说明.txt
          chmod +x dist/UOS-Portable-PhoneVoice/PhoneVoice-linux dist/UOS-Portable-PhoneVoice/启动.sh
          chmod -R a+rX dist/UOS-Portable-PhoneVoice
      - name: 打包 zip
        run: cd dist && zip -r -y ../PhoneVoice-UOS-x64-1.4.7.zip UOS-Portable-PhoneVoice
      - uses: actions/upload-artifact@v4
        with:
          name: uos-linux-x64
          path: PhoneVoice-UOS-x64-1.4.7.zip

  release:
    name: 发布 Release
    needs: [build-windows, build-macos-arm64]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: 列出产物
        run: find artifacts -type f
      - name: 发布到 Releases
        run: gh release create "$GITHUB_REF_NAME" artifacts/*/* --repo "$GITHUB_REPOSITORY" --title "语音输入电脑 $GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
