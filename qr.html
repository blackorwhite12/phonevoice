<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>扫码连接</title>
<style>
  body {
    margin: 0; min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: #0f1115; color: #e6e6e6;
    font-family: -apple-system, "PingFang SC", sans-serif;
  }
  h1 { font-size: 18px; margin: 0; }
  img { width: min(72vw, 380px); border-radius: 12px; margin: 18px 0 10px; }
  p { color: #9da7b3; margin: 2px 0 0; font-size: 14px; }
  .ok { color: #7ee787; }
</style>
</head>
<body>
<h1>手机语音输入 → Mac</h1>
<img src="/qr.png" alt="连接二维码">
<p id="status">正在检查服务状态…</p>
<script>
  fetch('/health').then(r => r.json()).then(d => {
    document.getElementById('status').innerHTML =
      '<span class="ok">● 服务运行中</span><br>' + location.origin + '/';
  }).catch(() => {
    document.getElementById('status').textContent = '服务未运行';
  });
</script>
</body>
</html>
