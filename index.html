<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="theme-color" content="#fff8fb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>声连（手机端）</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: max(16px, env(safe-area-inset-top)) 14px
      calc(24px + env(safe-area-inset-bottom));
    min-height: 100vh; min-height: 100dvh;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background:
      radial-gradient(circle at 8% 4%, rgba(255, 181, 209, .36), transparent 28%),
      radial-gradient(circle at 92% 76%, rgba(155, 201, 255, .26), transparent 32%),
      linear-gradient(168deg, #fff9fc 0%, #f8fbff 52%, #fbf7ff 100%);
    color: #403548;
    display: flex; flex-direction: column;
  }
  h1 {
    margin: 2px 0 7px; color: #403548; font-size: 28px; line-height: 1.2;
    text-align: center; letter-spacing: .5px; font-weight: 800;
  }
  h1 span { color: #eb5e92; font-size: .78em; font-weight: 700; }
  .status {
    width: fit-content; margin: 0 auto 14px; padding: 5px 11px;
    color: #648358; background: rgba(244, 251, 239, .9);
    border: 1px solid #dbead2; border-radius: 999px;
    font-size: 12px; text-align: center;
  }
  .status-dot {
    display: inline-block; width: 7px; height: 7px; margin-right: 6px;
    background: #76a867; border-radius: 50%; vertical-align: 1px;
  }
  .status.offline { color: #a46f6f; background: #fff4f4; border-color: #f0d6d6; }
  .status.offline .status-dot { background: #d77a7a; }
  .composer {
    display: grid; grid-template-columns: minmax(0, 1fr) 108px;
    gap: 10px; padding: 10px;
    background: rgba(255,255,255,.88); border: 2px solid #f3bfd2;
    border-radius: 25px;
    box-shadow: 0 12px 32px rgba(195, 118, 149, .12);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  }
  #input {
    width: 100%; min-height: 190px; margin: 0; padding: 10px 8px;
    color: #403548; background: #fffafc; border: 0; border-radius: 16px;
    font-family: inherit; font-size: 19px; line-height: 1.6;
    resize: none; outline: none;
  }
  #input::placeholder { color: #ad9fb4; }
  .modes {
    display: flex; flex-direction: column; gap: 7px; padding: 4px;
    background: #fff7fa; border: 1px solid #f2dce5; border-radius: 18px;
  }
  .mode {
    flex: 1; min-height: 0; margin: 0; padding: 7px 4px;
    color: #b96989; background: rgba(255,255,255,.78);
    border: 1px solid #f1cedc; border-radius: 13px;
    font-family: inherit; font-size: 11.5px; line-height: 1.3;
    font-weight: 700; letter-spacing: 0;
    box-shadow: none; cursor: pointer;
  }
  .mode[aria-pressed="true"] {
    color: #fff; background: linear-gradient(145deg, #f589b2, #e9588d);
    border-color: #e9588d; box-shadow: 0 5px 12px rgba(218, 75, 129, .22);
  }
  .mode.manual-send {
    font-size: 21px; font-weight: 800; letter-spacing: 3px;
  }
  .mode:active { transform: translateY(2px); box-shadow: none; }
  .mode:focus-visible { outline: 2px solid #6e9ddf; outline-offset: 2px; }
  .status-box {
    display: flex; align-items: center; gap: 8px;
    min-height: 38px; padding: 8px 13px;
    border-radius: 15px; font-size: 12px; line-height: 1.4;
  }
  .status-box::before {
    content: ""; flex: 0 0 auto; width: 7px; height: 7px;
    border-radius: 50%;
  }
  .status-rose {
    margin: 9px 0 18px; color: #b9547d;
    background: #fff6f9; border: 2px solid #f3c5d6;
  }
  .status-rose::before { background: #e86e9f; }
  .rx-card {
    padding: 14px 15px 15px;
    background: linear-gradient(150deg, rgba(248, 252, 255, .96), rgba(241, 248, 255, .96));
    border: 2px solid #cfe3fb; border-radius: 23px;
    box-shadow: 0 12px 30px rgba(87, 142, 204, .11);
  }
  .status-blue {
    margin-top: 8px; color: #557b9f;
    background: #f4f9ff; border: 2px solid #cfe3fb;
  }
  .status-blue::before { background: #72a9e7; }
  .rx-title {
    display: flex; align-items: center; margin-bottom: 9px;
    color: #497fb8; font-size: 14px; font-weight: 700;
  }
  .rx-title::before {
    content: ""; width: 7px; height: 7px; margin-right: 7px;
    background: #78adf0; border-radius: 50%;
  }
  .rx-body {
    display: grid; grid-template-columns: minmax(0, 1fr) 88px;
    gap: 9px; align-items: stretch;
  }
  #received {
    width: 100%; min-height: 128px; max-height: 220px; overflow-y: auto;
    padding: 12px 13px; color: #465468; background: rgba(255,255,255,.9);
    border: 1px solid #dceafb; border-radius: 16px;
    font-family: inherit; font-size: 18px; line-height: 1.6;
    white-space: pre-wrap; overflow-wrap: anywhere;
    outline: none; resize: none; user-select: text; -webkit-user-select: text;
  }
  #received::placeholder { color: #a9b7c6; }
  #received:not([readonly]) {
    border-color: #82b5ee; box-shadow: 0 0 0 3px rgba(126, 177, 235, .14);
  }
  .copy-modes { display: flex; flex-direction: column; gap: 7px; }
  .copy-mode {
    flex: 1; min-height: 42px; margin: 0; padding: 6px 4px;
    color: #527da9; background: rgba(255,255,255,.78);
    border: 1px solid #cbdcf0; border-radius: 13px;
    font-family: inherit; font-size: 11px; line-height: 1.3;
    font-weight: 700; letter-spacing: 0;
    box-shadow: none; cursor: pointer;
  }
  .copy-mode[aria-pressed="true"] {
    color: #fff; background: linear-gradient(145deg, #86b8ee, #5f99df);
    border-color: #5f99df; box-shadow: 0 5px 12px rgba(69, 128, 195, .2);
  }
  .copy-mode:focus-visible { outline: 2px solid #6e9ddf; outline-offset: 2px; }
  .ver {
    margin-top: auto; padding-top: 18px; color: #b3a7b8;
    font-size: 11px; text-align: center;
  }
  [hidden] { display: none !important; }
  @media (max-width: 350px) {
    body { padding-left: 10px; padding-right: 10px; }
    .composer { grid-template-columns: minmax(0, 1fr) 98px; gap: 8px; padding: 8px; }
    .mode { font-size: 11px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
  }
</style>
</head>
<body>
<h1>声连<span>（手机端）</span></h1>
<div class="status" id="status"><span class="status-dot"></span><span id="connection">连接状态：正在连接电脑…</span></div>

<div class="composer">
  <textarea id="input"
    placeholder="点这里说话，说完说暗号“发送”，文字自动飞到电脑里并自动回车"
    autocomplete="off" autocapitalize="off" spellcheck="false"
    enterkeyhint="send" autofocus></textarea>
  <div class="modes" aria-label="发送方式">
    <button class="mode" type="button" data-mode="1" aria-pressed="true">说“发送”<br>并回车</button>
    <button class="mode" type="button" data-mode="2" aria-pressed="false">说“发送”<br>不回车</button>
    <button class="mode" type="button" data-mode="3" aria-pressed="false">只点“发送”<br>才发送</button>
  </div>
</div>
<div id="msg" class="status-box status-rose" role="status" aria-live="polite">发送状态：等待语音输入…</div>

<section class="rx-card" id="rxCard" aria-live="polite">
  <div class="rx-title">从电脑复制过来内容</div>
  <div class="rx-body">
    <textarea id="received" readonly
      placeholder="电脑复制的文字会显示在这里"
      spellcheck="false"></textarea>
    <div class="copy-modes" aria-label="电脑文字复制方式">
      <button class="copy-mode" id="autoCopy" type="button" aria-pressed="true">自动<br>复制</button>
      <button class="copy-mode" id="copyNow" type="button">复制<br>当前</button>
      <button class="copy-mode" id="editReceived" type="button" aria-pressed="false">编辑<br>内容</button>
    </div>
  </div>
</section>
<div id="rxMsg" class="status-box status-blue" role="status" aria-live="polite">复制状态：等待电脑复制文字…</div>

<div class="ver" id="ver">电脑端版本：正在连接…</div>

<script>
const input = document.getElementById('input');
const modeButtons = [...document.querySelectorAll('.mode')];
const msg = document.getElementById('msg');
const connection = document.getElementById('connection');
const statusPanel = document.getElementById('status');
const rxCard = document.getElementById('rxCard');
const received = document.getElementById('received');
const rxMsg = document.getElementById('rxMsg');
const autoCopyButton = document.getElementById('autoCopy');
const copyNowButton = document.getElementById('copyNow');
const editReceivedButton = document.getElementById('editReceived');
const SEND_WORD = '发送';
let timer = null;
let sendMode = 1;
let lastSentText = '';
let lastSentAt = 0;
let lastRxId = 0;
let pendingRxText = '';
let autoCopy = true;
let editing = false;

try {
  const savedMode = Number(localStorage.getItem('shenglian-send-mode'));
  if ([1, 2, 3].includes(savedMode)) sendMode = savedMode;
  const savedAutoCopy = localStorage.getItem('shenglian-auto-copy');
  const legacyCopyMode = localStorage.getItem('shenglian-copy-mode');
  if (savedAutoCopy != null) autoCopy = savedAutoCopy === 'true';
  else if (legacyCopyMode != null) autoCopy = legacyCopyMode !== 'manual';
} catch (e) {}

function setSendMode(mode) {
  sendMode = mode;
  const manualButton = modeButtons.find(
    (button) => Number(button.dataset.mode) === 3,
  );
  modeButtons.forEach((button) => {
    button.setAttribute('aria-pressed', String(Number(button.dataset.mode) === mode));
  });
  manualButton.classList.toggle('manual-send', mode === 3);
  manualButton.innerHTML = mode === 3 ? '发送' : '只点“发送”<br>才发送';
  try { localStorage.setItem('shenglian-send-mode', String(mode)); } catch (e) {}
  input.focus();
}

function sendText(forceText, withEnter) {
  const source = forceText != null ? forceText : input.value;
  const text = source.trim();
  if (!text) return;

  const now = Date.now();
  if (text === lastSentText && now - lastSentAt < 3000) {
    input.value = '';
    return;
  }
  lastSentText = text;
  lastSentAt = now;

  clearTimeout(timer);
  input.value = '';
  msg.textContent = '发送状态：正在发送…';

  fetch('/send', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({text, enter: Boolean(withEnter)})
  }).then((response) => response.json()).then((data) => {
    if (!data.ok) throw new Error(data.error || '未知错误');
    if (data.method === 'clipboard') {
      msg.textContent = '发送状态：文字已放进电脑剪贴板，请按 Ctrl+V 或 Cmd+V。';
    } else {
      msg.textContent = withEnter
        ? '发送状态：已发送到电脑，并已回车。'
        : '发送状态：已发送到电脑，没有回车。';
    }
  }).catch((error) => {
    msg.textContent = '发送状态：发送失败，' + error.message;
    input.value = text;
  }).finally(() => {
    input.focus();
  });
}

function stripSendWord(text) {
  return text.replace(new RegExp(SEND_WORD + '\\s*[。．.!！?？]*$'), '');
}

function hasSendWord(text) {
  return new RegExp(SEND_WORD + '\\s*[。．.!！?？]*$').test(text);
}

function maybeSendByKeyword() {
  if (sendMode === 3) return;
  const raw = input.value;
  if (!hasSendWord(raw)) return;
  const body = stripSendWord(raw).trim();
  if (!body) return;
  sendText(body, sendMode === 1);
}

function scheduleKeywordCheck(delay) {
  clearTimeout(timer);
  timer = setTimeout(maybeSendByKeyword, delay);
}

modeButtons.forEach((button) => {
  button.addEventListener('click', () => {
    const nextMode = Number(button.dataset.mode);
    const pending = input.value.trim();
    if (nextMode === 3) {
      if (sendMode === 3) {
        if (pending) sendText(pending, false);
        else msg.textContent = '发送状态：先输入文字，再点“发送”。';
      } else {
        setSendMode(3);
        msg.textContent = '发送状态：手动模式，点“发送”发送。';
      }
      return;
    }
    setSendMode(nextMode);
  });
});

input.addEventListener('compositionend', () => scheduleKeywordCheck(120));
input.addEventListener('input', () => scheduleKeywordCheck(280));

document.addEventListener('visibilitychange', () => {
  if (!document.hidden) {
    input.focus();
    checkConnection();
  }
});

function setAutoCopy(enabled) {
  autoCopy = enabled;
  autoCopyButton.setAttribute('aria-pressed', String(enabled));
  autoCopyButton.innerHTML = enabled ? '自动<br>复制' : '自动<br>关闭';
  try { localStorage.setItem('shenglian-auto-copy', String(enabled)); } catch (e) {}
}

function saveReceivedCache() {
  if (!received.value) return;
  try {
    sessionStorage.setItem('shenglian-last-received', JSON.stringify({
      id: lastRxId,
      text: received.value,
    }));
  } catch (e) {}
}

function restoreReceivedCache() {
  try {
    const saved = JSON.parse(sessionStorage.getItem('shenglian-last-received') || 'null');
    if (!saved || !saved.text) return;
    lastRxId = Number(saved.id) || 0;
    received.value = saved.text;
    pendingRxText = saved.text;
    rxCard.hidden = false;
    rxMsg.textContent = '复制状态：已恢复上次内容，点“复制当前”可重新复制。';
  } catch (e) {}
}

async function copyReceivedText(text, automatic = false) {
  text = (text || '').trim();
  if (!text) {
    rxMsg.textContent = '复制状态：还没有可复制的电脑文字。';
    return false;
  }
  let copied = false;
  if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
    try {
      await navigator.clipboard.writeText(text);
      copied = true;
    } catch (e) {}
  }
  if (!copied) {
    try {
      received.focus();
      received.select();
      copied = document.execCommand('copy');
      if (!editing) received.setSelectionRange(received.value.length, received.value.length);
    } catch (e) {
      copied = false;
    }
  }
  rxMsg.textContent = copied
    ? (automatic
        ? '复制状态：已自动复制，可以直接在手机里粘贴。'
        : '复制状态：已复制，可以直接在手机里粘贴。')
    : '复制状态：浏览器未允许自动复制，请点右侧“手动复制”。';
  pendingRxText = copied ? '' : text;
  return copied;
}

async function showReceived(payload) {
  received.value = payload.text;
  rxCard.hidden = false;
  saveReceivedCache();
  if (autoCopy) {
    await copyReceivedText(payload.text, true);
  } else {
    pendingRxText = payload.text;
    rxMsg.textContent = '复制状态：已接收电脑文字，点右侧“复制当前”。';
  }
  fetch('/to-phone/ack', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({id: payload.id})
  }).catch(() => {});
}

function setEditing(enabled) {
  editing = enabled;
  received.readOnly = !enabled;
  editReceivedButton.setAttribute('aria-pressed', String(enabled));
  editReceivedButton.innerHTML = enabled ? '完成<br>编辑' : '编辑<br>内容';
  if (enabled) {
    received.focus();
    received.setSelectionRange(received.value.length, received.value.length);
    rxMsg.textContent = '复制状态：编辑中，完成后可复制当前内容。';
  } else {
    saveReceivedCache();
    rxMsg.textContent = '复制状态：编辑已保存，点“复制当前”更新剪贴板。';
  }
}

autoCopyButton.addEventListener('click', () => {
  setAutoCopy(!autoCopy);
  if (autoCopy && received.value.trim()) {
    copyReceivedText(received.value, true);
  } else {
    rxMsg.textContent = autoCopy
      ? '复制状态：自动复制已开启。'
      : '复制状态：自动复制已关闭，点“复制当前”。';
  }
});
copyNowButton.addEventListener('click', () => copyReceivedText(received.value));
editReceivedButton.addEventListener('click', () => setEditing(!editing));
received.addEventListener('input', saveReceivedCache);
received.addEventListener('click', () => {
  if (!editing) copyReceivedText(received.value);
});
document.addEventListener('pointerdown', () => {
  if (pendingRxText && autoCopy && !editing) copyReceivedText(pendingRxText, true);
}, {capture: true});

async function pollRx() {
  try {
    const response = await fetch('/to-phone/latest?after=' + lastRxId);
    const data = await response.json();
    if (!data.ok) return;
    if (data.text != null && data.id > lastRxId) {
      lastRxId = data.id;
      await showReceived({text: data.text, id: data.id});
    } else if (data.id > lastRxId) {
      lastRxId = data.id;
    }
  } catch (e) {
    setConnectionState(false);
  }
}
setInterval(pollRx, 1500);
restoreReceivedCache();
pollRx();

let reconnectTimer = null;

function setConnectionState(connected, version) {
  statusPanel.classList.toggle('offline', !connected);
  connection.textContent = connected
    ? '连接状态：已连接电脑'
    : '连接状态：已断开，正在自动重连…';
  if (connected) {
    document.getElementById('ver').textContent =
      '电脑端版本 v' + (version || '?');
  } else {
    document.getElementById('ver').textContent = '电脑端版本：连接已断开';
  }
}

async function checkConnection() {
  clearTimeout(reconnectTimer);
  const controller = typeof AbortController === 'function'
    ? new AbortController()
    : null;
  const abortTimer = controller
    ? setTimeout(() => controller.abort(), 2500)
    : null;
  try {
    const response = await fetch('/health?time=' + Date.now(), {
      cache: 'no-store',
      signal: controller ? controller.signal : undefined,
    });
    if (!response.ok) throw new Error('offline');
    const data = await response.json();
    if (!data.ok) throw new Error('offline');
    setConnectionState(true, data.version);
  } catch (e) {
    setConnectionState(false);
  } finally {
    if (abortTimer) clearTimeout(abortTimer);
    reconnectTimer = setTimeout(checkConnection, 3000);
  }
}

setSendMode(sendMode);
setAutoCopy(autoCopy);
checkConnection();
</script>
</body>
</html>
