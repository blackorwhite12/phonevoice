<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffe9f1">
<title>声连 · Vision Pro</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;padding:18px 16px 24px;min-height:100vh;display:flex;flex-direction:column;
       font-family:-apple-system,"PingFang SC","Wawati SC",sans-serif;color:#5b4a6b;
       background:linear-gradient(165deg,#ffe9f1 0%,#e8f4ff 55%,#f3e8ff 100%)}
  h1{font-size:22px;color:#ff7bac;margin:6px 0;text-shadow:0 2px 0 rgba(255,255,255,.7)}
  .sub{font-size:14px;color:#8b7ba0;margin-bottom:12px;line-height:1.6}
  textarea{flex:1;min-height:200px;font-size:18px;line-height:1.6;background:rgba(255,255,255,.95);
           color:#5b4a6b;border:3px solid #ffb6d5;border-radius:22px;padding:16px;resize:none;outline:none;
           box-shadow:0 8px 24px rgba(255,150,190,.25)}
  textarea:focus{border-color:#ff8fc0}
  textarea::placeholder{color:#cdb9dc}
  button{margin-top:14px;padding:16px;font-size:20px;font-weight:700;letter-spacing:2px;color:#fff;border:0;
         border-radius:999px;background:linear-gradient(135deg,#ff9ecb,#ff6fb0);
         box-shadow:0 6px 0 #e05694,0 12px 24px rgba(255,110,175,.35)}
  button:active{transform:translateY(3px);box-shadow:0 2px 0 #e05694}
  #msg{margin-top:10px;font-size:15px;color:#ff7bac;min-height:22px}
  .hint{font-size:13px;color:#9b87ac;margin-top:14px;line-height:1.7}
  .hint b{color:#7a6a8c}
</style>
</head>
<body>
  <h1>🎤 声连 · Vision Pro</h1>
  <div class="sub">用豆包输入法说话 → 点一下「发送」（直接复制）→ 去 Vision Pro 长捏粘贴。键盘不会掉，可以接着说。</div>
  <textarea id="input" placeholder="点这里，用豆包输入法说话 ✨" autofocus></textarea>
  <button id="send">✈️ 发送（复制到剪贴板）</button>
  <div id="msg"></div>
  <div class="hint">
    <b>怎么用：</b><br>
    ① 点一下输入框（键盘出来）→ 用豆包语音说话；<br>
    ② 点「<b>发送</b>」→ 文字进剪贴板（<b>页面不跳走、键盘不掉</b>）；<br>
    ③ 到 Vision Pro 输入框：<b>长捏 → 粘贴</b>；<br>
    ④ 回到本页接着说话即可。<br>
    <br>
    <b>前提：</b>两台设备同一 Apple ID、都开「接力」，蓝牙与 Wi‑Fi 打开（通用剪贴板）。<br>
    <b>不行时</b>：会自动退回"快捷指令"方式（需要手机里有名为「声连」的快捷指令）。
  </div>
<script>
  var SHORTCUT = "声连";
  var SEND_WORD = "发送";
  var input = document.getElementById('input');
  var msg = document.getElementById('msg');

  function stripSendWord(t){
    return t.replace(new RegExp(SEND_WORD + "\\s*[。．.!！?？]*$"), "");
  }

  function trimAll(s){ return s.replace(/^\s+|\s+$/g, ""); }

  // 把输入框里的文字复制到剪贴板 —— 不离开本页，所以键盘不会掉
  function copyNow(){
    var ok = false;
    try {
      input.focus();
      input.setSelectionRange(0, input.value.length);
      ok = document.execCommand('copy');
    } catch (e) { ok = false; }
    if (!ok) {
      try { navigator.clipboard.writeText(input.value); ok = true; } catch (e) { ok = false; }
    }
    return ok;
  }

  // 说「发送」或点「发送」按钮：先"复制"（不跳走）；万一复制不了，才退回快捷指令
  var lastSent = { text: '', at: 0 };
  function send(text){
    var t = trimAll(text != null ? text : input.value);
    if (!t) return;
    // 防重复：输入法偶发补发事件，同一句 3 秒内只处理一次
    var now = Date.now();
    if (t === lastSent.text && (now - lastSent.at) < 3000) { input.value = ''; return; }
    lastSent.text = t;
    lastSent.at = now;
    input.value = t;
    if (copyNow()) {
      input.value = "";
      msg.textContent = "🎉 已复制到剪贴板，去 Vision Pro 长捏粘贴（键盘没掉，接着说下一句就行）";
      input.focus();
      return;
    }
    input.value = "";
    var url = "shortcuts://run-shortcut?name=" + encodeURIComponent(SHORTCUT)
            + "&input=text&text=" + encodeURIComponent(t);
    msg.textContent = "👉 点一下「打开」，就复制到剪贴板了；然后去 Vision Pro 粘贴";
    window.location.href = url;
  }
  function check(){
    var raw = input.value;
    var body = stripSendWord(raw);
    if (body !== raw && body.trim()) send(body);
  }
  input.addEventListener('compositionend', check);
  input.addEventListener('input', check);
  document.getElementById('send').addEventListener('click', function(){ send(); });

  function focusInput(){
    try { input.focus(); } catch (e) {}
  }

  // 回到页面后的几秒内：谁让输入框失焦，就立刻抢回来 —— 专门顶住最后那一下"收"
  var guardUntil = 0;
  function armGuard(){
    guardUntil = Date.now() + 6000;
    focusInput();
    setTimeout(focusInput, 200);
    setTimeout(focusInput, 700);
  }
  input.addEventListener('blur', function(){
    if (Date.now() < guardUntil) {
      setTimeout(focusInput, 0);
      setTimeout(focusInput, 150);
    }
  });
  window.addEventListener('pageshow', armGuard);
  window.addEventListener('load', armGuard);
  window.addEventListener('focus', armGuard);
  document.addEventListener('visibilitychange', function(){ if (!document.hidden) armGuard(); });

  // iOS 必须靠"点击"才会给键盘；那就让你点页面任意空白处都能把光标放进输入框
  document.addEventListener('touchend', function(e){
    var t = e.target;
    if (t === input) return;
    if (t && t.closest && t.closest('button')) return;
    focusInput();
  }, {passive:true});

  armGuard();
</script>
</body>
</html>
